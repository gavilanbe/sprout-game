<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-828x1792.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png">

<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
<style>
  /* ============================================================
     LA CONSOLA. Todas las medidas salen de variables que pone fit()
     (js/16a-shell.js): --u es el tamaño de un píxel del juego; en
     escritorio la carcasa entera escala con él (píxeles enteros) y en
     móvil los mandos tienen tamaño de pulgar.
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{touch-action:none; overscroll-behavior:none; background:#07120b}
  body{
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, #1c3a26 0%, #0f2417 45%, #08140d 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; overflow:hidden; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #safe{position:fixed; visibility:hidden; pointer-events:none; left:0; top:0;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #cv{display:none}
  canvas.px{image-rendering:pixelated; image-rendering:crisp-edges; display:block}

  /* ---------- colores de carcasa (AJUSTES → Consola) ---------- */
  .console{
    --u:4px; --bt:32px; --bs:44px; --bb:52px; --bp:24px; --padw:184px; --brandh:72px; --ctrlh:248px;
    --dp:136px; --ab:60px; --pw:48px; --ph:14px;
    --body:#e6dcc5; --bodyL:#f8f1e0; --bodyD:#c6b792; --edge:#8a7c60; --bezel:#3b4549; --bezelL:#5b676d; --bezelD:#242b2f;
    --ink:#34335e; --grille:#a09378; --pat:none;
  }
  .console[data-color="salvia"]{ --body:#b5cca1; --bodyL:#d7e8c6; --bodyD:#8ea87b; --edge:#5a744d; --bezel:#2a3a31; --bezelL:#46594d; --bezelD:#18231d; --ink:#27462b; --grille:#7f9a70 }
  .console[data-color="baya"]{ --body:#d2495f; --bodyL:#ee7f90; --bodyD:#a6304a; --edge:#6b182b; --bezel:#2b2a33; --bezelL:#474555; --bezelD:#18171d; --ink:#fff0f2; --grille:#9c2c42 }
  .console[data-color="uva"]{ --body:#6f5bbd; --bodyL:#9c8ae0; --bodyD:#4d3e93; --edge:#312667; --bezel:#25212e; --bezelL:#403a51; --bezelD:#15121c; --ink:#f0ebff; --grille:#4a3c8c;
    --pat:repeating-linear-gradient(90deg,transparent 0 calc(var(--u)*11),rgba(255,255,255,.06) calc(var(--u)*11) calc(var(--u)*11.4)),
          repeating-linear-gradient(0deg,transparent 0 calc(var(--u)*17),rgba(255,255,255,.05) calc(var(--u)*17) calc(var(--u)*17.4)) }

  /* ---------- la carcasa ---------- */
  .console{
    position:relative; display:grid; padding:var(--bp);
    background:var(--pat), linear-gradient(165deg,var(--bodyL) 0%,var(--body) 38%,var(--bodyD) 100%);
    border-radius:calc(var(--u)*9) calc(var(--u)*9) calc(var(--u)*26) calc(var(--u)*9);
    box-shadow:
      inset 0 calc(var(--u)*.7) 0 rgba(255,255,255,.55),
      inset calc(var(--u)*.6) 0 0 rgba(255,255,255,.25),
      inset 0 calc(var(--u)*-1.4) 0 rgba(0,0,0,.16),
      0 calc(var(--u)*2.4) 0 var(--edge),
      0 calc(var(--u)*6) calc(var(--u)*14) rgba(0,0,0,.55),
      0 0 calc(var(--u)*40) rgba(112,216,56,.07);
    opacity:0; transform:translateY(12px) scale(.985); transition:opacity .45s ease, transform .55s cubic-bezier(.2,1.4,.4,1);
  }
  .console.ready{opacity:1; transform:none}
  .console.wide{grid-template-columns:var(--padw) auto var(--padw); grid-template-rows:auto 1fr; grid-template-areas:"brand scr pr" "pl scr pr"}
  .console.tall{grid-template-columns:1fr 1fr; grid-template-rows:auto var(--brandh) var(--ctrlh); grid-template-areas:"scr scr" "brand brand" "pl pr"}
  .scr{grid-area:scr; display:flex; align-items:center; justify-content:center}
  .brand{grid-area:brand; justify-self:center; align-self:center}
  .console.wide .brand{align-self:start; margin-top:calc(var(--u)*8)}
  .pl{grid-area:pl} .pr{grid-area:pr}
  .pad{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--dp)*.2)}

  /* ---------- la pantalla ---------- */
  .bezel{
    position:relative; padding:var(--bt) var(--bs) var(--bb);
    background:linear-gradient(180deg,var(--bezelL) 0%,var(--bezel) 16%,var(--bezelD) 100%);
    border-radius:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*16) calc(var(--u)*4);
    box-shadow:inset 0 calc(var(--u)*.5) 0 rgba(255,255,255,.14), inset 0 calc(var(--u)*-.8) 0 rgba(0,0,0,.4), 0 calc(var(--u)*.6) 0 rgba(255,255,255,.35);
  }
  .bz-top{position:absolute; top:calc(var(--bt)*.3); left:calc(var(--bs)*.55); right:calc(var(--bs)*.55); display:flex; align-items:center; gap:calc(var(--u)*2)}
  .bz-top i{flex:1; height:max(1px,calc(var(--u)*.45)); background:#a3304f; box-shadow:0 max(2px,calc(var(--u)*.9)) 0 #3c3f9a}
  .led{position:absolute; left:calc(var(--bs)*.18); top:calc(var(--bt) + var(--u)*40); display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.6)}
  .led b{width:calc(var(--u)*2.8); height:calc(var(--u)*2.8); min-width:5px; min-height:5px; border-radius:50%; background:#3a2622;
    box-shadow:inset 0 calc(var(--u)*-.5) 0 rgba(0,0,0,.4); transition:background .5s, box-shadow .5s}
  .led[data-s="on"] b{background:#7cf05a; box-shadow:0 0 calc(var(--u)*2.6) #7cf05a, 0 0 calc(var(--u)*7) rgba(124,240,90,.35), inset 0 calc(var(--u)*-.5) 0 rgba(0,0,0,.25)}
  .led[data-s="save"] b{background:#eaffc0; box-shadow:0 0 calc(var(--u)*4) #c8ff80, 0 0 calc(var(--u)*10) rgba(200,255,128,.5); transition:none}
  .led[data-s="low"] b{background:#ff5a3c; box-shadow:0 0 calc(var(--u)*3) #ff5a3c; animation:ledlow .55s ease-in-out infinite alternate}
  @keyframes ledlow{to{background:#6a2218; box-shadow:0 0 0 transparent}}
  .glass{position:relative; line-height:0; background:#0a140c;
    box-shadow:0 0 0 max(1px,calc(var(--u)*.6)) #0c1012, 0 0 0 max(2px,calc(var(--u)*1.1)) rgba(255,255,255,.05)}
  #screen{display:block; touch-action:none}
  .glass::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(128deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 26%,rgba(255,255,255,0) 40%),
      radial-gradient(ellipse 80% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.2) 100%)}
  .bz-logo{position:absolute; left:50%; bottom:calc(var(--bb)*.16); transform:translateX(-50%)}

  /* ---------- la cruceta ---------- */
  .dpad{position:relative; width:var(--dp); height:var(--dp); touch-action:none; cursor:pointer; transition:transform .05s ease-out}
  .dpad::before{content:""; position:absolute; inset:calc(var(--dp)*-.06); border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,.2) 0 55%,transparent 72%)}
  .dpad .h,.dpad .v{position:absolute; background:linear-gradient(180deg,#4a4a53 0%,#2d2d34 38%,#1d1d22 100%);
    border-radius:calc(var(--dp)*.055); box-shadow:0 calc(var(--dp)*.035) 0 #0f0f12, inset 0 calc(var(--dp)*.018) 0 rgba(255,255,255,.14)}
  .dpad .h{left:0; right:0; top:33.3%; height:33.4%} .dpad .v{top:0; bottom:0; left:33.3%; width:33.4%}
  .dpad .hub{position:absolute; left:39%; top:39%; width:22%; height:22%; border-radius:50%; background:radial-gradient(circle at 50% 35%,#18181c,#34343b)}
  .dpad .arm{position:absolute; width:33.4%; height:33.4%; display:flex; align-items:center; justify-content:center; transition:background .05s}
  .dpad .arm::before{content:""; width:0; height:0; border:calc(var(--dp)*.05) solid transparent; filter:drop-shadow(0 calc(var(--dp)*.012) 0 rgba(0,0,0,.6))}
  #tU{left:33.3%; top:0} #tU::before{border-bottom:calc(var(--dp)*.07) solid #5c5c66; margin-top:calc(var(--dp)*-.06)}
  #tD{left:33.3%; bottom:0} #tD::before{border-top:calc(var(--dp)*.07) solid #5c5c66; margin-top:calc(var(--dp)*.06)}
  #tL{left:0; top:33.3%} #tL::before{border-right:calc(var(--dp)*.07) solid #5c5c66; margin-left:calc(var(--dp)*-.06)}
  #tR{right:0; top:33.3%} #tR::before{border-left:calc(var(--dp)*.07) solid #5c5c66; margin-left:calc(var(--dp)*.06)}
  .dpad .arm.down{background:rgba(0,0,0,.22); border-radius:calc(var(--dp)*.05)}
  .dpad[data-t="u"]{transform:perspective(calc(var(--dp)*3)) rotateX(11deg)}
  .dpad[data-t="d"]{transform:perspective(calc(var(--dp)*3)) rotateX(-11deg)}
  .dpad[data-t="l"]{transform:perspective(calc(var(--dp)*3)) rotateY(-11deg)}
  .dpad[data-t="r"]{transform:perspective(calc(var(--dp)*3)) rotateY(11deg)}
  .dpad[data-t="ul"]{transform:perspective(calc(var(--dp)*3)) rotateX(8deg) rotateY(-8deg)}
  .dpad[data-t="ur"]{transform:perspective(calc(var(--dp)*3)) rotateX(8deg) rotateY(8deg)}
  .dpad[data-t="dl"]{transform:perspective(calc(var(--dp)*3)) rotateX(-8deg) rotateY(-8deg)}
  .dpad[data-t="dr"]{transform:perspective(calc(var(--dp)*3)) rotateX(-8deg) rotateY(8deg)}

  /* ---------- Z y X: botones redondos; ZURRÓN y MÚSICA: pastillas ---------- */
  .ab{position:relative; width:calc(var(--ab)*2.55); height:calc(var(--ab)*1.75)}
  .ab::before{content:""; position:absolute; left:calc(var(--ab)*-.12); right:calc(var(--ab)*-.12); top:calc(var(--ab)*.25); height:calc(var(--ab)*1.24);
    border-radius:calc(var(--ab)*.62); background:rgba(0,0,0,.1); box-shadow:inset 0 calc(var(--ab)*.04) calc(var(--ab)*.06) rgba(0,0,0,.2); transform:rotate(-25deg)}
  .btn{position:absolute; width:var(--ab); height:var(--ab); touch-action:none; cursor:pointer}
  .btn .cap{position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 26% 22%,var(--hi) 0 6%,transparent 7%),radial-gradient(circle at 42% 34%,var(--mid) 0 56%,var(--lo) 60%);
    box-shadow:0 calc(var(--ab)*.075) 0 var(--edg), 0 calc(var(--ab)*.14) calc(var(--ab)*.16) rgba(0,0,0,.35), inset 0 calc(var(--ab)*-.05) 0 rgba(0,0,0,.18);
    transition:transform .04s, box-shadow .04s}
  .btn.down .cap{transform:translateY(calc(var(--ab)*.06)); box-shadow:0 calc(var(--ab)*.015) 0 var(--edg), 0 calc(var(--ab)*.04) calc(var(--ab)*.06) rgba(0,0,0,.35), inset 0 calc(var(--ab)*.05) calc(var(--ab)*.08) rgba(0,0,0,.25)}
  #tA{right:0; top:0; --hi:#fff2c4; --mid:#f0b848; --lo:#c68826; --edg:#7a4e14}
  #tB{left:0; bottom:0; --hi:#ffd6b8; --mid:#dc7a3e; --lo:#a8501e; --edg:#6a2e10}
  .btn .lab{position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:calc(var(--ab)*.14)}
  .pillw{position:relative; display:flex; flex-direction:column; align-items:center; gap:calc(var(--ph)*.7); touch-action:none; cursor:pointer; padding:calc(var(--ph)*.5)}
  .pill{width:var(--pw); height:var(--ph); border-radius:var(--ph); transform:rotate(-25deg);
    background:linear-gradient(180deg,#a2a2aa,#77777f); box-shadow:0 0 0 max(1px,calc(var(--ph)*.2)) rgba(0,0,0,.22), 0 calc(var(--ph)*.22) 0 #4a4a52, inset 0 calc(var(--ph)*.14) 0 rgba(255,255,255,.3);
    transition:transform .04s}
  .pillw.down .pill{transform:rotate(-25deg) translateY(calc(var(--ph)*.18)); box-shadow:0 0 0 max(1px,calc(var(--ph)*.2)) rgba(0,0,0,.22), 0 calc(var(--ph)*.05) 0 #4a4a52}
  .grille{display:flex; gap:calc(var(--u)*1.7); transform:rotate(-30deg)}
  .grille i{display:block; width:max(3px,calc(var(--u)*1.35)); height:max(22px,calc(var(--u)*11)); border-radius:99px; background:var(--grille);
    box-shadow:inset 0 max(1px,calc(var(--u)*.45)) max(1px,calc(var(--u)*.5)) rgba(0,0,0,.5), 0 max(1px,calc(var(--u)*.3)) 0 rgba(255,255,255,.32)}
  .fs{grid-area:pr; align-self:start; justify-self:end; margin:calc(var(--u)*1.5) calc(var(--u)*1); width:max(26px,calc(var(--u)*7)); height:max(26px,calc(var(--u)*7));
    border-radius:50%; border:0; cursor:pointer; background:rgba(0,0,0,.12); box-shadow:inset 0 1px 2px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center}
  .fs:hover{background:rgba(0,0,0,.2)}
  .fs canvas{pointer-events:none}

  /* ---------- en escritorio: la cruceta a la izquierda, los botones a la derecha ---------- */
  .console.tall .fs{grid-area:brand; align-self:center; margin:0 4px}
  .console.wide .pl{gap:calc(var(--u)*9)}
  .console.wide .pr{gap:calc(var(--u)*7); padding-top:calc(var(--u)*10)}
  .console.wide .pr .grille{margin-top:calc(var(--u)*2)}
  .console.tall .pr .grille{position:absolute; right:calc(var(--u)*4); bottom:calc(var(--u)*6)}

  /* ---------- en el móvil: la consola es la pantalla entera ---------- */
  body.touch{justify-content:flex-start}
  .console.m{width:100vw; height:100vh; height:100dvh; border-radius:0;
    padding:calc(env(safe-area-inset-top,0px) + var(--bp)) calc(env(safe-area-inset-right,0px) + var(--bp)) calc(env(safe-area-inset-bottom,0px) + var(--bp)) calc(env(safe-area-inset-left,0px) + var(--bp));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  .console.m.tall{grid-template-rows:auto var(--brandh) 1fr}
  .console.m .bezel{border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*12) calc(var(--u)*3)}
  .console.m .bz-top,.console.m .led span{display:none}
  .console.m.wide .bz-logo,.console.m.wide .led{display:none}
  .console.m.tall .pl{justify-content:center; gap:calc(var(--dp)*.18); padding-bottom:4px}
  .console.m.tall .pr{justify-content:center; gap:calc(var(--dp)*.18); padding-bottom:4px}
  .console.m.wide .pl,.console.m.wide .pr{gap:18px}
  .console.m.wide .brand{margin-top:6px}
  .console.m .grille{display:none}
  .console.m.tall .pr .grille{display:flex; right:10px; bottom:6px}

  /* ---------- debajo de la consola (solo si cabe) ---------- */
  .foot{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:22px; opacity:.85}
  .foot a{display:block; border-bottom:1px solid rgba(185,214,125,.35); padding-bottom:4px}
  .foot a:hover{border-color:rgba(248,232,200,.8)}
  body.touch .foot,.foot.off{display:none}

  /* ---------- el aviso de la aplicación (instalar, versión nueva, sin red) ---------- */
  .notice{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:20; transform:translate(-50%,-170%);
    display:flex; align-items:center; gap:10px; padding:8px 16px; border:0; border-radius:999px; cursor:pointer;
    background:#1f2e25; box-shadow:0 0 0 2px #0a100c, 0 3px 0 #0a100c, 0 10px 24px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.08);
    transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
  .notice.show{transform:translate(-50%,0)}
  .notice::before{content:""; width:8px; height:8px; border-radius:50%; background:#7cf05a; box-shadow:0 0 8px #7cf05a; flex:none}
  .notice[data-k="update"]{background:#2b4a30} .notice[data-k="update"]::before{animation:ledlow .5s ease-in-out infinite alternate; background:#ffd060; box-shadow:0 0 8px #ffd060}
  .notice[data-k="install"]::before,.notice[data-k="ios"]::before{background:#f0b848; box-shadow:0 0 8px #f0b848}
  .notice:hover{filter:brightness(1.12)}
  body.touch .notice{transform:translate(-50%,-50%) scale(.6); opacity:0; padding:5px 12px; transition:transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s}
  body.touch .notice.show{transform:translate(-50%,-50%) scale(1); opacity:1}
</style>
</head>
<body>
<div id="safe"></div>
<main class="console wide" id="console" data-color="marfil">
  <div class="scr">
    <div class="bezel">
      <div class="bz-top"><i></i><canvas class="px lab" id="labTop"></canvas><i></i></div>
      <div class="led" id="led" data-s="off"><b></b><canvas class="px lab" id="labLed"></canvas></div>
      <div class="glass"><canvas id="screen" aria-label="SPROUT: aventura del Valle Raíz"></canvas></div>
      <canvas class="px bz-logo" id="bzLogo" aria-label="SPROUT y las 8 semillas"></canvas>
    </div>
  </div>
  <canvas class="px brand" id="brand" aria-label="gavilanbe"></canvas>
  <div class="pad pl">
    <div class="dpad" id="dpad" aria-label="cruceta">
      <i class="h"></i><i class="v"></i><i class="hub"></i>
      <i class="arm" id="tU"></i><i class="arm" id="tD"></i><i class="arm" id="tL"></i><i class="arm" id="tR"></i>
    </div>
    <div class="pillw" id="tS" aria-label="música"><i class="pill"></i><canvas class="px lab" id="labS"></canvas></div>
  </div>
  <div class="pad pr">
    <div class="ab">
      <div class="btn" id="tB" aria-label="objeto"><div class="cap"><canvas class="px" id="capB"></canvas></div><canvas class="px lab" id="labB"></canvas></div>
      <div class="btn" id="tA" aria-label="hoja"><div class="cap"><canvas class="px" id="capA"></canvas></div><canvas class="px lab" id="labA"></canvas></div>
    </div>
    <div class="pillw" id="tM" aria-label="zurrón"><i class="pill"></i><canvas class="px lab" id="labM"></canvas></div>
    <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <button class="fs" id="fsBtn" aria-label="pantalla completa"><canvas class="px" id="fsIco"></canvas></button>
</main>
<nav class="foot" id="foot">
  <a href="slice.html" aria-label="La primera semilla: demo con sprites generados"><canvas class="px" id="footLink"></canvas></a>
  <canvas class="px" id="footLine" aria-hidden="true"></canvas>
</nav>
<button class="notice" id="notice" hidden aria-live="polite"><canvas class="px" id="noticeTxt"></canvas></button>
<canvas id="cv" width="160" height="144"></canvas>
