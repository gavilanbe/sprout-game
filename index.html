<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SPROUT · y las 8 semillas</title>
<meta name="description" content="Un Zelda-like estilo Game Boy Color: el Valle Raíz, cuatro mazmorras, guardianes que no mueren y las cuatro estaciones.">
<meta name="theme-color" content="#0b1a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0b1a10; --pine2:#102416; --moss:#2a4a34; --leaf:#70d838;
    --cream:#f8e8c8; --amber:#e8b050;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% -20%, #16301e 0%, transparent 60%),
      repeating-conic-gradient(var(--pine2) 0% 25%, var(--pine) 0% 50%) 0 0/8px 8px,
      var(--pine);
    color:var(--cream);
    font-family:"Press Start 2P", monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px; overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none;
  }
  html{touch-action:none; overscroll-behavior:none}
  header{text-align:center}
  h1{
    font-size:clamp(18px,4vw,30px); letter-spacing:4px;
    color:var(--leaf);
    text-shadow:0 3px 0 #1d4f22, 0 6px 0 #0d2a12, 0 0 24px rgba(112,216,56,.35);
  }
  h1 .seed{color:var(--amber); text-shadow:0 3px 0 #6e4a14, 0 6px 0 #3a2708, 0 0 24px rgba(232,176,80,.35)}
  .tag{font-size:8px; color:#7fae8c; margin-top:10px; letter-spacing:1px}
  .shell{
    position:relative; line-height:0;
    padding:14px; background:linear-gradient(#16301e,#0e2014);
    border:3px solid var(--moss); border-radius:10px;
    box-shadow:0 0 0 3px #07120b, 0 14px 40px rgba(0,0,0,.6), 0 0 60px rgba(112,216,56,.12);
  }
  .shell::before{ /* power LED */
    content:""; position:absolute; top:5px; left:8px; width:5px; height:5px; border-radius:50%;
    background:var(--leaf); box-shadow:0 0 8px var(--leaf);
  }
  canvas{
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#081408; display:block; touch-action:none;
  }
  .scan{ /* sutiles scanlines sobre la pantalla */
    position:absolute; inset:14px; pointer-events:none; border-radius:2px;
    background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.10) 2px 3px);
    mix-blend-mode:multiply;
  }
  .keys{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:8px; color:#9ec7aa}
  .keys span{display:flex; align-items:center; gap:6px}
  kbd{
    font:inherit; background:#142a1b; border:2px solid var(--moss); border-bottom-width:4px;
    border-radius:5px; padding:5px 7px; color:var(--cream);
  }
  footer{font-size:7px; color:#4c7259; letter-spacing:1px}
  .slice-link{display:inline-block;margin-top:12px;color:#b9d67d;font-size:8px;line-height:1.8;text-decoration:none;border-bottom:1px solid #4b6d36;padding-bottom:3px}
  .slice-link:hover,.slice-link:focus-visible{color:#f8e8c8}
  /* mandos táctiles */
  #touch{display:none; position:fixed; left:0; right:0; bottom:env(safe-area-inset-bottom,0px); height:190px; pointer-events:none}
  body.touch #touch{display:block}
  /* en móvil: fuera la decoración de escritorio, el juego agarra toda la pantalla */
  body.touch{padding:0; gap:0}
  /* en vertical la pantalla se centra en el hueco que dejan los mandos (fit() reserva 200px), sin pisarlos */
  @media (orientation:portrait){ body.touch{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))} }
  body.touch header, body.touch .keys, body.touch footer{display:none}
  body.touch .shell{padding:0; border:0; border-radius:0; box-shadow:none; background:transparent}
  body.touch .shell::before{display:none}
  body.touch .scan{inset:0}
  .tbtn{
    position:absolute; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    font-family:"Press Start 2P",monospace; line-height:1; color:var(--cream);
    touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
  }
  /* la cruceta: una cruz de una pieza, contorno de tinta y bisel de luz arriba */
  #dpad{position:absolute; left:14px; bottom:16px; width:156px; height:156px; pointer-events:none}
  #dpad::before,#dpad::after{content:""; position:absolute; clip-path:polygon(33.3% 0,66.7% 0,66.7% 33.3%,100% 33.3%,100% 66.7%,66.7% 66.7%,66.7% 100%,33.3% 100%,33.3% 66.7%,0 66.7%,0 33.3%,33.3% 33.3%)}
  #dpad::before{inset:0; background:#081408}
  #dpad::after{inset:4px; background:linear-gradient(#3e7048 0 3px,#2a5a38 3px 30%,#1c3a26 70%,#12281a)}
  #dcenter{position:absolute; left:61px; top:61px; width:34px; height:34px; border-radius:50%; background:#12281a; box-shadow:inset 0 3px 0 #081408, 0 1px 0 #3e7048; z-index:1}
  #dpad .tbtn{width:52px; height:52px; z-index:2}
  #dpad .tbtn::before{content:""; width:0; height:0; border:9px solid transparent; filter:drop-shadow(0 2px 0 #081408)}
  #tU{left:52px; top:0} #tU::before{border-bottom:12px solid #cfe8b0!important; margin-top:-10px}
  #tD{left:52px; top:104px} #tD::before{border-top:12px solid #cfe8b0!important; margin-top:10px}
  #tL{left:0; top:52px} #tL::before{border-right:12px solid #cfe8b0!important; margin-left:-10px}
  #tR{left:104px; top:52px} #tR::before{border-left:12px solid #cfe8b0!important; margin-left:10px}
  #dpad .tbtn.down::before{filter:drop-shadow(0 0 0 #081408) brightness(1.35); transform:translateY(2px)}
  /* Z y X: botones redondos con relieve, como los de la consola */
  .rbtn{border-radius:50%; border:3px solid #2a1a0e; font-size:16px; color:#3a2410; text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .rbtn::after{content:attr(data-label); position:absolute; top:100%; margin-top:10px; font-size:8px; color:#cfe8b0; text-shadow:0 1px 0 #081408; white-space:nowrap}
  #tA{right:20px; bottom:62px; width:74px; height:74px; background:radial-gradient(circle at 34% 28%,#fff0c0 0 14%,#f0b848 15% 58%,#c88a28 59%); box-shadow:0 6px 0 #7a4e14,0 9px 12px rgba(0,0,0,.45)}
  #tB{right:108px; bottom:28px; width:60px; height:60px; background:radial-gradient(circle at 34% 28%,#ffd0b0 0 14%,#d8783c 15% 58%,#a8501e 59%); box-shadow:0 5px 0 #6a2e10,0 8px 10px rgba(0,0,0,.45); color:#3a1408}
  #tA.down{transform:translateY(4px); box-shadow:0 2px 0 #7a4e14,0 3px 6px rgba(0,0,0,.4)}
  #tB.down{transform:translateY(3px); box-shadow:0 2px 0 #6a2e10,0 3px 6px rgba(0,0,0,.4)}
  #tM{right:22px; bottom:156px; height:24px; padding:0 10px; border-radius:12px; background:#2a4a34; border:3px solid #081408; box-shadow:inset 0 2px 0 #4a7a58,0 3px 0 #0c1c12; font-size:8px; color:#f8e8c8}
  #tM.down{transform:translateY(2px); box-shadow:inset 0 2px 0 #4a7a58}
  /* la Ó de la fuente sale encogida: O normal y una tilde de dos píxeles encima */
  #tM .acc{font-weight:normal; position:relative}
  #tM .acc::after{content:""; position:absolute; left:2px; top:-1px; width:2px; height:1px; background:currentColor; box-shadow:1px -1px 0 currentColor}
</style>
</head>
<body>
<header>
  <h1>SPR<span class="seed">O</span>UT</h1>
  <div class="tag">y las 8 semillas · un Zelda-like hecho a mano</div>
  <a class="slice-link" href="slice.html">NUEVO · La primera semilla — demo con sprites generados ↗</a>
</header>

<div class="shell">
  <canvas id="cv" width="160" height="144" aria-label="SPROUT: aventura del Valle Raíz"></canvas>
  <div class="scan"></div>
</div>

<div class="keys">
  <span><kbd>←↑↓→</kbd> mover</span>
  <span><kbd>Z</kbd> hoja / hablar</span>
  <span><kbd>X</kbd> objeto</span>
  <span><kbd>↵</kbd> zurrón</span>
  <span><kbd>M</kbd> música</span>
</div>
<footer>OCHO SEMILLAS · CUATRO ESTACIONES · NINGÚN GUARDIÁN MUERE</footer>

<div id="touch">
  <div id="dpad"><div id="dcenter"></div>
    <div class="tbtn" id="tU"></div><div class="tbtn" id="tD"></div>
    <div class="tbtn" id="tL"></div><div class="tbtn" id="tR"></div></div>
  <div class="tbtn rbtn" id="tA" data-label="HOJA">Z</div>
  <div class="tbtn rbtn" id="tB" data-label="OBJETO">X</div>
  <div class="tbtn" id="tM">ZURR<b class="acc">O</b>N</div>
</div>
